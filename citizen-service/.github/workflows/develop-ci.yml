name: Java CI/CD Pipeline (2025)

on:
  push:
    branches: [ "develop" ] # Εκτέλεση μόνο στο develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests
        # Χρήση -B για Batch mode και test profile για αποφυγή παγώματος
        run: mvn -B clean verify -Dspring.profiles.active=test

      - name: Upload Test Reports (Unit & Integration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: citizen-service-executable
          path: target/*.jar

  create-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: citizen-service-executable

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha-${{ github.run_number }}
          name: Release v0.1.0-alpha
          files: "*.jar"
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
