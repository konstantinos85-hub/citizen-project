name: Citizen Project CI/CD Pipeline

on:
  push:
    branches:
      - develop  # Ο αγωγός εκτελείται μόνο για commits στο κλαδί develop

jobs:
  build-and-test:
    name: Build, Unit & API Testing
    runs-on: ubuntu-latest

    steps:
      # 1. Check-out τον κώδικα από το αποθετήριο
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Εγκατάσταση JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Μεταγλώττιση και Εκτέλεση Δοκιμών (Unit & API/Integration)
      # Χρησιμοποιούμε τη φάση verify για να εκτελεστούν όλα τα tests.
      # Επιβάλλουμε το profile 'test' και απενεργοποιούμε το interactive μενού.
      - name: Run Unit and API Tests
        run: |
          mvn clean verify \
          -Dspring.profiles.active=test \
          -Dcitizen.client.enabled=false \
          -DskipTests=false

      # 4. Μεταφόρτωση Αρχείων Αναφοράς (Test Reports) για οπτικοποίηση
      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always() # Διασφαλίζει τη μεταφόρτωση ακόμα και αν αποτύχουν τα tests
        with:
          name: test-execution-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  release:
    name: Early Software Release
    needs: build-and-test # Εκτελείται μόνο αν ολοκληρωθούν επιτυχώς οι δοκιμές
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write # Απαραίτητο για τη δημιουργία Release στο GitHub το 2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Package
        run: mvn package -DskipTests

      # 5. Μεταφόρτωση του εκτελέσιμου (.jar) στο GitHub Releases (Προαιρετικό)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}-alpha
          name: Early Release v0.1.${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            **/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
