name: Citizen Project CI/CD Pipeline

on:
  push:
    branches:
      - develop  # Εκτέλεση μόνο για commits στο κλάδι develop

jobs:
  build-and-test:
    name: Build and Automated Testing
    runs-on: ubuntu-latest

    steps:
      # 1. Check-out τον πηγαίο κώδικα
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Εγκατάσταση Java 17 (Temurin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Εκτέλεση Δοκιμών (Unit & API)
      # Χρησιμοποιούμε mvn verify για να τρέξουν Surefire & Failsafe reports.
      # Επιβάλλουμε το profile 'test' για να μην παγώσει ο αγωγός στο μενού.
      - name: Run Unit and API Tests
        run: |
          mvn clean verify \
          -Dspring.profiles.active=test \
          -Dcitizen.client.enabled=false \
          -Dspring.main.web-application-type=none \
          -Dmaven.test.failure.ignore=true

      # 4. Μεταφόρτωση Αρχείων Αναφοράς (Artifacts) - ΕΔΩ ΕΙΝΑΙ Η ΟΠΤΙΚΟΠΟΙΗΣΗ
      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always() # Διασφαλίζει τη μεταφόρτωση ακόμα και αν αποτύχουν τα tests
        with:
          name: test-execution-reports-${{ github.run_number }}
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
            **/target/failsafe-reports/*.xml
            **/target/failsafe-reports/*.txt
          if-no-files-found: warn

  release:
    name: Create Software Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write # Απαραίτητο για τη δημιουργία Release το 2025
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Executable JAR
        run: mvn package -DskipTests

      # 5. Μεταφόρτωση στο GitHub Releases (Προαιρετικό)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}-alpha
          name: Early Release v0.1.${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            **/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
