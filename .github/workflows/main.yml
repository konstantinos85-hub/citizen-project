name: Citizen Project CI/CD Pipeline

on:
  push:
    branches:
      - develop  # Εκτέλεση μόνο για commits στο κλάδι develop

jobs:
  build-and-test:
    name: Build and Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout τον κώδικα από το GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Εγκατάσταση Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Εκτέλεση Δοκιμών (Unit & API) με πλήρη απενεργοποίηση του Interactive Menu
      - name: Run Unit and API Tests
        run: |
          mvn clean verify \
          -Dspring.profiles.active=test \
          -Dcitizen.client.enabled=false \
          -Dspring.main.web-application-type=none \
          -Dcheckstyle.skip=true \
          -Dmaven.main.skip=false \
          -DskipTests=false

      # 4. Μεταφόρτωση Αρχείων Αναφοράς (Artifacts) για οπτικοποίηση
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always() # Για να ανέβουν τα reports ακόμα και αν κάποιο test αποτύχει
        with:
          name: test-execution-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  release:
    name: Create Software Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Application
        run: mvn package -DskipTests

      # 5. Μεταφόρτωση εκτελέσιμου στο GitHub Releases (Προαιρετικό)
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}-alpha
          name: Early Release v0.1.${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            **/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
