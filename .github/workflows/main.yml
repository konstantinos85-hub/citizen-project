name: Citizen Project CI/CD Pipeline

on:
  push:
    branches:
      - develop  # Εκτέλεση μόνο για commits στο κλαδί develop

jobs:
  build-and-test:
    name: Build and Automated Testing
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout τον πηγαίο κώδικα
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Εγκατάσταση Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Εκτέλεση Δοκιμών (Unit & API)
      # Χρησιμοποιούμε το mvn verify για να εκτελεστούν Surefire (Unit) και Failsafe (API) tests.
      # Επιβάλλουμε το profile 'test' και απενεργοποιούμε το interactive mode.
      - name: Run Unit and API Tests
        run: |
          mvn clean verify \
          -Dspring.profiles.active=test \
          -Dcitizen.client.enabled=false \
          -Dspring.main.web-application-type=none \
          -DskipTests=false

      # 4. Μεταφόρτωση Αρχείων Αναφοράς (Artifacts) για οπτικοποίηση εκτέλεσης
      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always() # Διασφαλίζει τη μεταφόρτωση ακόμα και αν αποτύχουν οι δοκιμές
        with:
          name: test-execution-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  release:
    name: Create Early Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write # Απαραίτητο για τη δημιουργία Release το 2025
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Package
        run: mvn package -DskipTests

      # 5. Μεταφόρτωση του εκτελέσιμου (.jar) στο GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}-alpha
          name: Early Release v0.1.${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            **/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
