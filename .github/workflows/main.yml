name: Citizen Project CI/CD Pipeline

on:
  push:
    branches:
      - develop  # Εκτέλεση μόνο για commits στο κλαδί develop

jobs:
  build-and-test:
    name: Build, Unit & API Testing
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout τον κώδικα από το αποθετήριο
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Εγκατάσταση JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Μεταγλώττιση του πηγαίου κώδικα
      - name: Compile Code
        run: mvn clean compile

      # 4. Εκτέλεση Δοκιμών (Unit & API/Integration)
      # Χρησιμοποιούμε τη φάση verify για να καλύψουμε όλα τα είδη δοκιμών.
      # Επιβάλλουμε την απενεργοποίηση του client για να μην "κολλήσει" ο αγωγός.
      - name: Run Unit and API Tests
        # Επιβάλλουμε το profile test και την απενεργοποίηση του client μέσω command line
        run: mvn verify -Dspring.profiles.active=test -Dcitizen.client.enabled=false -Dspring.main.web-application-type=none



      # 5. Μεταφόρτωση Αρχείων Αναφοράς (Test Reports) για οπτικοποίηση
      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always() # Εκτελείται ακόμα και αν αποτύχουν οι δοκιμές
        with:
          name: test-execution-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  release:
    name: Create Early Software Release
    needs: build-and-test # Εκτελείται μόνο αν περάσουν επιτυχώς οι δοκιμές
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write # Απαραίτητο για τη δημιουργία Release το 2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Executables
        run: mvn package -DskipTests

      # 6. Μεταφόρτωση των εκτελέσιμων (.jar) στο GitHub Releases
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}-alpha
          name: Early Release v0.1.${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            **/target/*.jar
            **/target/*.war
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
