name: Java CI-CD Pipeline (2025)
on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: [actions/checkout](github.com)@v4

      - name: Set up JDK 21
        uses: [actions/setup-java](github.com)@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        # ΠΡΟΣΟΧΗ: Μπαίνουμε στον φάκελο του service για να τρέξει το Maven
        run: |
          cd citizen-service
          mvn -B clean verify -Dspring.profiles.active=test

      - name: Upload Test Reports
        if: always()
        uses: [actions/upload-artifact](github.com)@v4
        with:
          name: test-reports
          path: citizen-service/target/*-reports/

      - name: Upload Executable JAR
        uses: [actions/upload-artifact](github.com)@v4
        with:
          name: citizen-service-jar
          path: citizen-service/target/*.jar
